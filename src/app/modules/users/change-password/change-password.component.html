<div class="container-fluid">

  <!-- Header tipo breadcrumb como los demás módulos -->
  <div class="card card-body py-3">
    <div class="row align-items-center">
      <div class="col-12">
        <div class="d-sm-flex align-items-center justify-content-between">
          <h4 class="mb-4 mb-sm-0 card-title">
            Cambiar Contraseña
          </h4>

          <nav aria-label="breadcrumb" class="ms-auto">
            <ol class="breadcrumb m-0">
              <li class="breadcrumb-item d-flex align-items-center">
                <a routerLink="/" class="text-muted text-decoration-none d-flex">
                  <span class="material-symbols-rounded">home</span>
                </a>
              </li>
              <li class="breadcrumb-item" aria-current="page">
                <span class="badge fw-medium fs-2 bg-primary-subtle text-primary">
                  Seguridad
                </span>
              </li>
            </ol>
          </nav>
        </div>
      </div>
    </div>
  </div>

  <!-- Card principal -->
  <div class="card">
    <div class="card-body p-4">

      <form [formGroup]="changePasswordForm" (ngSubmit)="submit()">

        <div class="row justify-content-center">
          <div class="col-12 col-md-8 col-lg-6">

            <!-- Contraseña actual -->
            <div class="mb-3">
              <label class="form-label">Contraseña Actual</label>
              <input type="password"
                     class="form-control"
                     formControlName="currentPassword">
            </div>

            <!-- Nueva contraseña -->
            <div class="mb-3">
              <label class="form-label">Nueva Contraseña</label>
              <input type="password"
                     class="form-control"
                     formControlName="newPassword">
              <small class="text-danger"
                     *ngIf="changePasswordForm.get('newPassword')?.hasError('minlength')">
                Mínimo 8 caracteres
              </small>
            </div>

            <!-- Confirmar contraseña -->
            <div class="mb-3">
              <label class="form-label">Confirmar Nueva Contraseña</label>
              <input type="password"
                     class="form-control"
                     formControlName="confirmPassword">
              <small class="text-danger"
                     *ngIf="changePasswordForm.hasError('notMatching')">
                Las contraseñas no coinciden
              </small>
            </div>

            <!-- Error backend -->
            <div *ngIf="errorMessage" class="alert alert-danger">
              {{ errorMessage }}
            </div>

            <!-- Botón -->
            <div class="d-grid">
              <button type="submit"
                      class="btn btn-primary"
                      [disabled]="loading || changePasswordForm.invalid">
                {{ loading ? 'Actualizando...' : 'Cambiar Contraseña' }}
              </button>
            </div>

          </div>
        </div>

      </form>

    </div>
  </div>

</div>
