<mat-card>

    <mat-card-header>

        <mat-card-title>

            📎 Documentos

        </mat-card-title>

        <mat-card-subtitle>

            Revise los documentos enviados por el cliente.

        </mat-card-subtitle>

    </mat-card-header>

    <mat-card-content>

        <!-- Comprador -->

        <div class="mb-4">

            <h3>Documento del comprador</h3>

            <button
                mat-raised-button
                color="primary"
                (click)="openDocument(form.get('customer_dni_url')?.value)">

                Ver documento

            </button>

        </div>

        <!-- Segundo comprador -->

        <div
            class="mb-4"
            *ngIf="isMancomunado">

            <h3>Documento del segundo comprador</h3>

            <button
                mat-raised-button
                color="primary"
                (click)="openDocument(form.get('customer_second_dni_url')?.value)">

                Ver documento

            </button>

        </div>

        <!-- Beneficiario -->

        <div>

            <h3>Documento del beneficiario</h3>

            <button
                mat-raised-button
                color="primary"
                (click)="openDocument(form.get('beneficiary_dni_url')?.value)">

                Ver documento

            </button>

        </div>

    </mat-card-content>

</mat-card>
